# Pinned upstream sources for Scripts/build-xcframework.sh.
#
# Every tarball is checked against the SHA-256 below BEFORE it is extracted,
# including tarballs already cached in .build-tor/. A mismatch aborts the build
# (fail closed); nothing is re-downloaded or overwritten automatically.
#
# On top of the hash pin, the upstream OpenPGP signature is verified against
# the pinned keyring in keys/ and the signer's PRIMARY key fingerprint must be
# one of the fingerprints listed for that file. Tor signs a .sha256sum file
# rather than the tarball; that file is checked in under signatures/ and must
# list exactly the pinned hash.
#
# Bumping a version: download the new tarball and its upstream signature,
# verify the signature by hand against the fingerprints published upstream
# (Tor: support.torproject.org "verify signatures"; OpenSSL:
# doc/fingerprints.txt; zlib: zlib.net; libevent: release notes), then update
# the line here and the file under signatures/. Never copy a hash from a
# tarball you have not verified.
#
# Fields (whitespace separated):
#   tarball  sha256  keyring(keys/)  signature(signatures/)  trusted-primary-fingerprints(comma separated)
