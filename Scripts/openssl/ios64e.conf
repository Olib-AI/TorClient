## arm64e (pointer authentication) iOS device target for OpenSSL.
##
## Loaded with `Configure --config=Scripts/openssl/ios64e.conf ios64e-xcrun`.
## Identical to OpenSSL's own `ios64-xcrun` (Configurations/15-ios.conf)
## except for `-arch arm64e`. `ios64-xcrun` cannot simply be reused: its
## `-arch arm64` would be inherited and produce fat objects.
##
## The aarch64 perlasm keeps working on arm64e: it makes no indirect calls,
## and its return-address signing (AARCH64_SIGN_LINK_REGISTER in
## crypto/arm_arch.h) follows __ARM_FEATURE_PAC_DEFAULT, which clang sets for
## arm64e.
my %targets = (
    "ios64e-xcrun" => {
        inherit_from     => [ "ios-common" ],
        CC               => "xcrun -sdk iphoneos cc",
        cflags           => add("-arch arm64e -fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },
);
